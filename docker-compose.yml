services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gme
      POSTGRES_PASSWORD: gme
      POSTGRES_DB: alerts
    ports:
      - "5433:5432"
    volumes:
      - ./api/db/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./api/db/002_seed.sql:/docker-entrypoint-initdb.d/002_seed.sql:ro
